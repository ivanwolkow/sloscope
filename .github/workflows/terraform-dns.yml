name: Terraform DNS

on:
  pull_request:
    paths:
      - 'infra/dns/**'
      - '.github/workflows/terraform-dns.yml'
  workflow_dispatch:
    inputs:
      operation:
        description: Plan only, or plan and apply the selected main/master commit
        type: choice
        options:
          - plan
          - apply
        default: plan

permissions:
  contents: read

concurrency:
  group: terraform-dns
  cancel-in-progress: false

defaults:
  run:
    working-directory: infra/dns

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.3
      - run: terraform fmt -check
      - run: terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform validate

  dns:
    if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: validate
    runs-on: ubuntu-latest
    environment: dns-production
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      SPACESHIP_API_KEY: ${{ secrets.SPACESHIP_API_KEY }}
      SPACESHIP_API_SECRET: ${{ secrets.SPACESHIP_API_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.3
      - name: Check configuration
        run: |
          for name in TF_TOKEN_app_terraform_io SPACESHIP_API_KEY SPACESHIP_API_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing $name; see infra/dns/README.md"
              exit 1
            fi
          done
      - name: Initialize remote state
        run: terraform init -input=false -lockfile=readonly
      - name: Plan
        run: terraform plan -input=false -lock-timeout=5m -out=dns.tfplan
      - name: Apply saved plan
        if: inputs.operation == 'apply'
        run: terraform apply -input=false -lock-timeout=5m dns.tfplan

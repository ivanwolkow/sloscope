name: Validate Terraform GitHub

on:
  pull_request:
    paths:
      - 'infra/github/**'
      - '.github/workflows/terraform-github.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/github
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.3
      - run: terraform fmt -check
      - run: terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform validate
      - run: bash -n set-dns-secrets.sh
